plugins {
    id 'com.android.application'
}

// tools/build_android.sh passes -PcnaRootDir; by default CNA is the sibling checkout, as for the desktop build.
def museumRoot = rootProject.file("..").canonicalFile
def cnaRootDir = file(providers.gradleProperty("cnaRootDir").getOrElse("${museumRoot}/../cna")).canonicalFile
def cnaSdlJavaDir = new File(cnaRootDir, "third_party/SDL/android-project/app/src/main/java")
if (!cnaSdlJavaDir.isDirectory()) {
    throw new GradleException("CNA's SDL Android Java sources were not found at ${cnaSdlJavaDir}; pass -PcnaRootDir=/path/to/cna.")
}
// Build output stays in the shared build-consumer/ tree (android-* prefix), never inside the source tree.
def outRoot = new File(museumRoot, "build-consumer")
def abis = providers.gradleProperty("museumAbis").getOrElse("x86_64").split(",")
def generatedAssetsDir = new File(outRoot, "android-assets")
layout.buildDirectory = new File(outRoot, "android-gradle")

android {
    namespace = "org.libcna.museum"
    compileSdkVersion 35
    buildToolsVersion = "36.1.0"   // the SDK's complete build tools (AGP 8.7 would default to 34.0.0)
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId "org.libcna.museum"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                def cmakeArgs = [
                        "-DANDROID_PLATFORM=android-24",
                        "-DANDROID_STL=c++_static",
                        "-DCNA_ROOT_DIR=${cnaRootDir}",
                        "-DCNA_GRAPHICS_RENDERER=OPENGLES3",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        // Gradle runs ninja without -j, which means every core: a job pool holds compiling and linking to two.
                        "-DCMAKE_JOB_POOLS=museum=2",
                        "-DCMAKE_JOB_POOL_COMPILE=museum",
                        "-DCMAKE_JOB_POOL_LINK=museum",
                        // Not built for Android: the C ABI client starts a child process, FFmpeg is not in the NDK.
                        "-DMUSEUM_C_API=OFF",
                        "-DMUSEUM_VIDEO=OFF",
                        // CNA's Inspector agent supports desktop targets only.
                        "-DMUSEUM_INSPECTOR=OFF"
                ] + providers.gradleProperty("museumCmakeArgs").getOrElse("").split(" ").findAll { !it.isEmpty() }
                arguments(*cmakeArgs.collect { it.toString() })
                targets "cna-3d-museum"
                abiFilters(*abis)
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version "4.1.2"
            buildStagingDirectory new File(outRoot, "android-cxx")
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [generatedAssetsDir]
            java.srcDirs = [cnaSdlJavaDir, 'src/main/java']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lint {
        abortOnError = true
    }
}

// Content/ is packaged as assets; GamerServices/ (the offline achievement catalogue) beside it, as on the desktop.
tasks.register("syncMuseumContent", Sync) {
    from(new File(museumRoot, "Content")) { into "Content" }
    from(new File(museumRoot, "Content/GamerServices")) { into "GamerServices" }
    into(generatedAssetsDir)
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("syncMuseumContent"))
}
