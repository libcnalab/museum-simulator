<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CNA 3D Museum — WebGL 2</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b12; }
    main { width: 100%; height: 100%; display: grid; place-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; background: #080b12; outline: none; }
    #status { position: fixed; inset: auto 1rem 1rem; padding: .55rem .8rem; border: 1px solid #806a2c;
      border-radius: .35rem; background: rgba(8, 11, 18, .88); color: #f4d671; font-size: .9rem; }
    #fullscreen { position: fixed; top: 1rem; left: 1rem; padding: .55rem .8rem; border: 1px solid #806a2c;
      border-radius: .35rem; background: rgba(8, 11, 18, .88); color: #f4d671; cursor: pointer; }
    #fullscreen:hover { background: #292418; }
  </style>
</head>
<body>
  <main><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></main>
  <button id="fullscreen" type="button">Fullscreen</button>
  <div id="status">Loading museum…</div>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const query = new URLSearchParams(location.search);
    const smoke = query.get('smoke') === '1';
    // ?script=STEPS runs a museum script, as --script does natively (tools/web_tour.sh tours every room this way).
    const script = query.get('script');
    // ?renderer=WEBGPU picks the other renderer a two-renderer build carries (the default is WEBGL2).
    const renderer = query.get('renderer');
    var Module = {
      canvas,
      arguments: (renderer ? ['--renderer', renderer] : []).concat(
                 script ? ['--script', script, '--fixed-step', '0.02', '--no-audio', '--no-save']
               : smoke ? ['--script', 'walk:1,0,60;wait:60;stats;quit', '--fixed-step', '0.1', '--no-audio', '--save', '--fresh'] : []),
      print(text) { console.log('MUSEUM_OUT ' + text); },
      printErr(text) { console.error('MUSEUM_ERR ' + text); },
      onAbort(reason) {
        status.textContent = 'The museum stopped: ' + reason;
        status.hidden = false;
        console.error('MUSEUM_ABORT ' + reason);
      },
      onExit(code) { console.log('MUSEUM_EXIT ' + code); },
      setStatus(text) {
        status.textContent = text;
        status.hidden = !text || text === 'Running...';
      },
      monitorRunDependencies(left) {
        if (left) status.textContent = `Loading museum data… (${left})`;
      }
    };
    canvas.addEventListener('click', () => canvas.focus());
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (Module.requestFullscreen) Module.requestFullscreen(false, true);
      else canvas.requestFullscreen();
    });
    window.addEventListener('error', event => console.error('MUSEUM_PAGE_ERROR ' + event.message));
  </script>
  {{{ SCRIPT }}}
</body>
</html>
